name: Mapa fotek z e-shopu

on:
  schedule:
    - cron: '15 5-18 * * *'   # každou hodinu 6:15–19:15 (zimní čas) – stejně často, jak appka fotky čte
  workflow_dispatch:

jobs:
  fotky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stáhnout feed fotek a uložit sdílenou mapu do Supabase
        run: python3 .github/scripts/fotky.py
